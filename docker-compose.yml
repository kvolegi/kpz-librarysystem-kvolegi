# ============================================
# Library System — Docker Compose
# ============================================

version: "3.9"

services:
  # ── Web Application ──
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: library-web
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=library_db
      - DB_USER=library_user
      - DB_PASSWORD=library_pass
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-logs:/app/logs
    restart: unless-stopped
    networks:
      - library-net

  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: library-postgres
    environment:
      POSTGRES_DB: library_db
      POSTGRES_USER: library_user
      POSTGRES_PASSWORD: library_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library_user -d library_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - library-net

volumes:
  postgres-data:
    driver: local
  app-logs:
    driver: local

networks:
  library-net:
    driver: bridge
